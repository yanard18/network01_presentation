<!-- SLIDE: DNS Hierarchy & Right-to-Left Resolution (Minimalist Version) -->
<section>
  <h2><i class="fa-solid fa-sitemap highlight-cyan"></i> DNS Hiyerarşisi (Hierarchy): Sağdan Sola Çözümleme (Resolution)</h2>

  <!-- Clean Container (No Outer Card Borders, Minimalist Layout) -->
  <div style="max-width: 920px; margin: 1.2rem auto 0 auto; text-align: center;">
    
    <!-- Central FQDN Domain Display -->
    <div style="margin-bottom: 1.2rem; text-align: center;">
      <!-- Domain Interactive Pills -->
      <div style="display: flex; justify-content: center; align-items: center; gap: 0.4rem; font-family: var(--font-mono); font-size: 1.8rem; font-weight: 700; margin: 0.6rem 0;">
        <!-- Subdomain -->
        <span id="dns-part-www" class="dns-pill" style="padding: 0.3rem 0.8rem; border-radius: 8px; transition: all 0.3s ease; border: 1px solid transparent;">
          www
        </span>
        <span style="color: var(--text-muted);">.</span>
        
        <!-- Authoritative Domain -->
        <span id="dns-part-sld" class="dns-pill" style="padding: 0.3rem 0.8rem; border-radius: 8px; transition: all 0.3s ease; border: 1px solid transparent;">
          example
        </span>
        <span style="color: var(--text-muted);">.</span>
        
        <!-- TLD -->
        <span id="dns-part-tld" class="dns-pill" style="padding: 0.3rem 0.8rem; border-radius: 8px; transition: all 0.3s ease; border: 1px solid transparent;">
          net
        </span>
        
        <!-- Root Dot -->
        <span id="dns-part-root" class="dns-pill" style="padding: 0.3rem 0.8rem; border-radius: 8px; transition: all 0.3s ease; border: 1px solid transparent; color: var(--accent-yellow);">
          .
        </span>
      </div>

      <!-- Resolution Direction Focus Indicator -->
      <div id="dns-arrow-indicator" style="font-family: var(--font-mono); font-size: 0.88rem; margin-top: 0.6rem; color: var(--accent-cyan); font-weight: 600;">
        <i class="fa-solid fa-magnifying-glass highlight-cyan"></i> Odak (Focus): <code>www.example.net.</code> için İlk Recursive Sorgu
      </div>
    </div>

    <!-- Step Buttons Only -->
    <div style="margin-bottom: 1.2rem; text-align: center;">
      <div style="display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap;">
        <button class="sim-btn step-btn" id="dns-btn-0" onclick="window.dnsSim.setStep(0)">0. Recursive</button>
        <button class="sim-btn step-btn" id="dns-btn-1" onclick="window.dnsSim.setStep(1)">1. Root (.)</button>
        <button class="sim-btn step-btn" id="dns-btn-2" onclick="window.dnsSim.setStep(2)">2. TLD (.net)</button>
        <button class="sim-btn step-btn" id="dns-btn-3" onclick="window.dnsSim.setStep(3)">3. Auth (example)</button>
        <button class="sim-btn step-btn" id="dns-btn-4" onclick="window.dnsSim.setStep(4)">4. Host (www)</button>
      </div>
    </div>

    <!-- Clean Execution Step Details (No Heavy Border Cards) -->
    <div id="dns-card-detail" style="text-align: left; max-width: 820px; margin: 0 auto; min-height: 110px; font-size: 0.88rem;">
      <!-- Content populated dynamically via JavaScript -->
  </div>
</section>
